      ME: Maine
      MD: Maryland
      MA: Massachusetts
      MI: Michigan
      MN: Minnesota
      MS: Misisipi
      MO: Misuri
      MT: Montana
      NE: Nebraska
      NV: Nevada
      NH: Nuevo Hampshire
      NJ: Nueva Jersey
      NM: Nuevo México
      NY: Nueva York
      NC: Carolina del Norte
      ND: Dakota del Norte
      OH: Ohio
      OK: Oklahoma
      OR: Oregón
      PA: Pensilvania
      RI: Rhode Island
      SC: Carolina del Sur
      SD: Dakota del Sur
      TN: Tennessee
      TX: Texas
      UT: Utah
      VT: Vermont
