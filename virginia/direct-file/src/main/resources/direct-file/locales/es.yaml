# The seven custom input types this application registers (Main.scala's `inputTypes`), and the words
# their templates need. Every string below is Direct File's own — the field labels from
# `fields.generics.address` and `fields./bankAccount`, the state names from `enums.statesAndProvinces`
# and `enums.armedForces`, and each `invalid` from that type's own `errorMessages` entry — so the port
# says what upstream says rather than paraphrasing it.
#
# `invalid` is one message per type rather than one per failure reason. The browser handlers build
# the value with the Fact Graph's own factory and get back a JSEither whose Left is a typed reason,
# but `fg-set` has no place to put a per-reason message for a value it never sees as a string (see
# website-static/js/inputs/masked-number.js). One accurate sentence beats a reason code.
#
# AE appears four times in the state list on purpose: upstream offers Africa, Canada, Europe and the
# Middle East separately over the one code the Fact Graph stores.
inputs:
  tin:
    invalid: "Ingresa un número válido. Esto debe verse así: 123-45-6789"
  ein:
    invalid: Esto debe verse de esta manera 12-3456789
  pin:
    invalid: El PIN debe tener 5 dígitos
  ip-pin:
    invalid: El PIN tiene que tener 6 dígitos
  phone-number:
    invalid: "Esto debe verse así: 212-555-0134"
  address:
    country: País
    street: Dirección
    street2: Línea 2 de la dirección
    city: Ciudad
    state: Estado o puesto militar
    zip: Código postal
    invalid: El código postal tiene que tener el formato de 12345 ó 12345-1234 ó 12345-1234567
    states:
      AL: Alabama
      AK: Alaska
      AZ: Arizona
      AR: Arkansas
      CA: California
      CO: Colorado
      CT: Connecticut
      DE: Delaware
      DC: Distrito de Columbia
      FL: Florida
