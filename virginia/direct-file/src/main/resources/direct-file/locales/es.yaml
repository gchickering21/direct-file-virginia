      WV: Virginia Occidental
      WI: Wisconsin
      WY: Wyoming
      armedForcesAmericas: AA - Fuerzas Armadas Américas
      armedForcesAfrica: AE - Fuerzas Armadas África
      armedForcesCanada: AE - Fuerzas Armadas Canadá
      armedForcesEurope: AE - Fuerzas Armadas Europa
      armedForcesMiddleEast: AE - Fuerzas Armadas Medio Oriente
