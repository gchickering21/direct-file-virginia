  h3-01a5ac: Por qué estas cifras
  fg-detail-bffc0d:
    summary: 'Línea 4, deducción por edad: <fg-show path="/vaAgeDeduction"/>'
    p-7b9c68: 'Un declarante nacido el 1 de enero de 1939 o antes resta $12,000; un declarante de 65 años o más nacido después
      resta $12,000 menos $1 por cada $1 de AGI federal ajustado por encima del umbral de su estado civil (§ 58.1-322.03(5)).
      Su parte: <fg-show path="/vaPrimaryFilerAgeDeductionAllowed"/>.<span condition="/vaIsFilingStatus2" operator="isTrue">
      La parte de su cónyuge: <fg-show path="/vaSpouseAgeDeductionAllowed"/>.</span>'
    p-bbef02: La línea 4 muestra $0 porque la declaración reclama en su lugar un crédito para personas de bajos ingresos,
      que la ley no permite junto con la deducción por edad. Vea la línea 23.
  fg-detail-32f58b:
    summary: 'Línea 7, sustracciones del Anexo ADJ: <fg-show path="/vaScheduleAdjSubtractions"/>'
    p-bf9d2e: 'Tres sustracciones sumadas: beneficios por desempleo <fg-show path="/vaUnemploymentCompensationSubtraction"/>
      (código 37, el total del 1099-G menos lo devuelto), sueldo básico militar <fg-show path="/vaMilitaryBasicPaySubtraction"/>
      (código 38, todo hasta $15,000, reduciéndose hasta nada a los $30,000) y beneficios militares <fg-show path="/vaMilitaryBenefitsSubtraction"/>
      (código 60, hasta $30,000 y no más que la cantidad tributable de sus 1099-R).'
    p-668cae: La sustracción por sueldo básico muestra $0 porque la declaración reclama en su lugar un crédito para personas
      de bajos ingresos. Vea la línea 23.
  fg-detail-ab3ee1:
    summary: 'Línea 12, exenciones: <fg-show path="/vaExemptions"/>'
    p-9d44ec: <fg-show path="/vaPersonalExemptionCount"/> × <fg-show path="/vaPersonalExemptionAmount"/> por usted, un cónyuge
      en una declaración conjunta y cada dependiente, <fg-show path="/vaPersonalExemptions"/>, más <fg-show path="/vaAgedOrBlindExemptionCount"/>
      × <fg-show path="/vaAgedOrBlindExemptionAmount"/> por cada uno de ustedes que tenga 65 años o más o sea ciego, <fg-show
      path="/vaAgedOrBlindExemptionsAllowed"/> (§ 58.1-322.03(2)).
    p-3ea63e: La parte por 65 años o más y por ceguera se deja fuera porque la declaración reclama en su lugar un crédito
      para personas de bajos ingresos. Vea la línea 23.
  fg-detail-4deab3:
    summary: 'Línea 16, impuesto sobre la renta de Virginia: <fg-show path="/vaTax"/>'
    p-9755b5: 'Virginia grava los primeros <fg-show path="/vaRateScheduleBracket1Top"/> de ingreso tributable al <fg-show
      path="/vaRateScheduleRate1Percent"/>%, la parte hasta <fg-show path="/vaRateScheduleBracket2Top"/> al <fg-show path="/vaRateScheduleRate2Percent"/>%,
      la parte hasta <fg-show path="/vaRateScheduleBracket3Top"/> al <fg-show path="/vaRateScheduleRate3Percent"/>% y el resto
      al <fg-show path="/vaRateScheduleRate4Percent"/>% (§ 58.1-320). Su ingreso tributable de <fg-show path="/vaTaxableIncome"/>
      está <fg-show path="/vaIncomeAboveBracketBase"/> por encima de <fg-show path="/vaTaxBracketBase"/>: los <fg-show path="/vaTaxAtBracketBase"/>
      de impuesto en ese punto más el <fg-show path="/vaMarginalRatePercent"/>% de <fg-show path="/vaIncomeAboveBracketBase"/>,
      <fg-show path="/vaTaxOnIncomeAboveBracketBase"/>, redondeado al dólar.'
    p-87ae6e: 'La línea 16 es $0 de todos modos: su ingreso bruto ajustado de Virginia está por debajo del umbral de presentación
      para su estado civil (§ 58.1-321).'
  fg-detail-07f245:
    summary: 'Línea 23, crédito para trabajadores y familias de bajos ingresos: <fg-show path="/vaLowIncomeCredit"/>'
    p-71f1c8: En esta declaración no se reclama ningún crédito.
    p-f8c459: 'Crédito Reembolsable por Ingreso del Trabajo de Virginia: <fg-show path="/vaLowIncomeCredit"/>'
    p-600197: El 15% de los <fg-show path="/vaFederalEarnedIncomeCredit"/> del crédito por ingreso del trabajo de su declaración
      federal. Virginia lo paga aunque supere su impuesto, así que puede convertirse en un reembolso.
    p-88f21a: 'Crédito por Ingreso del Trabajo de Virginia: <fg-show path="/vaLowIncomeCredit"/>'
    p-eed81c: El 20% de los <fg-show path="/vaFederalEarnedIncomeCredit"/> del crédito por ingreso del trabajo de su declaración
      federal, hasta el monto de su impuesto de Virginia. Valía más que el 15% reembolsable (<fg-show path="/vaRefundableEarnedIncomeCredit"/>).
    p-272240: 'Crédito para Personas de Bajos Ingresos: <fg-show path="/vaLowIncomeCredit"/>'
    p-3622de: $300 por cada persona de su hogar, porque el ingreso bruto ajustado de Virginia de su familia no supera la pauta
      de pobreza de <fg-show path="/vaPovertyGuideline"/> para su tamaño. Hasta el monto de su impuesto de Virginia.
    p-757ccd: Para reclamarlo, su declaración renuncia a su deducción por edad de <fg-show path="/vaAgeDeductionAllowed"/>.
      El crédito reduce más su impuesto.
    p-451e98: Para reclamarlo, su declaración renuncia a su exención de <fg-show path="/vaAgedOrBlindExemptionsAllowed"/>
      por tener 65 años o más o por ceguera. El crédito reduce más su impuesto.
    p-197310: Para reclamarlo, su declaración renuncia a su sustracción de <fg-show path="/vaMilitaryBasicPaySubtractionAllowed"/>
      por sueldo básico militar. El crédito reduce más su impuesto.
    p-a209eb: No tuvo que pedirlo. Los tres créditos de Virginia para personas de bajos ingresos salen de su declaración federal;
      la declaración reclama el que más le conviene, como pide el Formulario 760 (Anexo ADJ, líneas 10 a 17).
    p-c42507: Podría reclamar <fg-show path="/vaBestLowIncomeCredit"/> del crédito de Virginia para trabajadores y familias
      de bajos ingresos, pero solo renunciando a su deducción por edad, a su exención por tener 65 años o más o por ceguera,
      o a su sustracción por sueldo básico militar. Conservarlas reduce más su impuesto, así que su declaración las conserva.
  fg-detail-306512:
    summary: 'Línea 33, impuesto sobre el uso: <fg-show path="/vaUseTax"/>'
    p-412ce3: <fg-show path="/vaUntaxedPurchases"/> de compras por las que no se pagó impuesto sobre las ventas de Virginia,
      multiplicados por la tasa del <fg-show path="/vaUseTaxRatePercent"/>% de <fg-show path="/vaLocalityName"/>, redondeado
      al dólar (instrucciones del Formulario 760 de 2024, línea 33).
    p-bd9aa7: No compró nada sin pagar el impuesto sobre las ventas de Virginia, así que la línea 33 es $0.
  p-382bd2: Cada línea indica la ley de la que proviene. Las líneas que no se muestran están fuera del alcance de este prototipo
    y se toman como $0. Aquí no se presenta nada.
  p-d623bc: <strong>Virginia Tax</strong> responde las preguntas sobre esta declaración, no el IRS.
  h3-1c8ae7: Guarde una copia
  p-801bf8: Imprima esta página como constancia de la declaración, o descargue el archivo de respuestas que este prototipo
    guarda en su navegador; la primera pantalla de Virginia puede reanudar desde él en otro dispositivo.
  button-59d4a6: Imprimir esta declaración
  button-04d9c6: Descargar sus respuestas
/your-taxes/virginia/virginia-sign:
  title: Firme su declaración de Virginia
  h2-dbc9d5: Firme su declaración ante la Mancomunidad
  p-564a3c: Virginia Tax compara los salarios y la retención del W-2 de su declaración con lo que informó su empleador. Sus
    cuatro respuestas no se pueden verificar con ningún informe; por eso usted firma por ellas.
  /vaDeclaration:
    question: Su declaración
    hint: El Formulario 760 se firma bajo pena de ley.
    options:
      signed:
        name: Declaro que esta declaración es verdadera, correcta y completa según mi leal saber y entender, incluidas mis
          respuestas sobre dónde vivía, la paga militar, los aportes a Commonwealth Savers y las compras sin impuestos.
  button-5b455a: Enviar a Virginia Tax
  p-877924: '<strong>No se envió nada.</strong> En esta demostración su declaración firmada no va a ninguna parte: no se transmitió
    ningún Formulario 760 a Virginia Tax y no se presentó nada. En un servicio administrado por el estado, este es el momento
    en que Virginia Tax la recibiría.'
  p-12ce70: <strong>Solo demostración.</strong> No se firma ni se envía nada a Virginia Tax. A continuación, revisará y firmará
    su declaración federal.
