# Spanish for the Virginia screens, hand-written. flow_es.yaml is generated from Direct File's
# own Spanish by `make transpile-es` and knows nothing about Virginia, so this file is merged into
# it by scripts/merge-virginia-es.py. Keys are form-builder's, content-addressed on the English
# words in flow_en.yaml: change the English and the key changes, so re-copy it here. Locality names
# are proper nouns and stay as they are. The words the Virginia scripts show are not here: they are
# the virginia.ui.* keys in es.yaml.
/your-taxes/virginia/virginia-intro:
  title: Virginia continúa desde aquí
  p-d605b1: Le damos la bienvenida, <fg-show path="/primaryFiler/firstName"/>
  h2-268326: Sus respuestas federales están listas. Virginia continúa desde aquí.
  p-a157d3: 'Usted vivió en Virginia todo <fg-show path="/taxYear"/>, así que también presenta el Formulario 760 ante Virginia
    Tax. La mayor parte ya está completa: el Formulario 760 parte de su declaración federal, su empleador ya envió su W-2
    a Virginia y Virginia Tax ya tiene registrado lo que usted ha pagado.'
  table-0:
    tr-0:
      th-df3427: Servicio de Impuestos Internos <span class="va-handoff__form">Formulario 1040</span>
      th-abfe87: Virginia Tax <span class="va-handoff__form">Formulario 760</span>
    tr-1:
      td-857736: <strong>Sus respuestas están completas.</strong> Revisará y firmará su declaración federal después de esta
        sección.
      td-123c74: <strong>Quedan unos cinco minutos.</strong> Cuatro preguntas que solo usted puede responder y luego su declaración.
    tr-2:
      td-1147b9: Le da a Virginia su ingreso bruto ajustado, su estado civil para efectos de la declaración, su fecha de nacimiento
        y sus W-2.
      td-56ad90: 'Agrega lo que Virginia Tax ya tiene registrado: los pagos que usted hizo a Virginia.'
  p-4e369d: <a href="../virginia-known/" class="usa-button">Comenzar mi declaración de Virginia</a>
  p-45ca08: <strong>Solo demostración.</strong> Este es un proyecto de clase que muestra cómo una declaración estatal podría
    calcularse a partir de la declaración federal con el código publicado por el IRS. No es un servicio del IRS ni de Virginia
    Tax y no presenta nada.
  fg-detail-32e52d:
    summary: Lo que cubre este prototipo y lo que deja fuera
    p-3acefb: 'Lo que cubre este prototipo: la deducción estándar, las exenciones, la deducción por edad, el umbral de presentación,
      la tabla de tasas, la retención, cuatro partidas del Anexo ADJ (beneficios por desempleo, sueldo básico militar, beneficios
      militares y aportes a Commonwealth Savers), el Crédito para Personas de Bajos Ingresos y los dos Créditos por Ingreso
      del Trabajo de Virginia, el código de localidad y el impuesto sobre el uso (Código de Virginia §§ 58.1-320, 58.1-321,
      58.1-322.02, 58.1-322.03, 58.1-339.8). Lo que deja fuera: deducciones detalladas, las demás adiciones y sustracciones,
      los demás créditos, declaraciones de residente parcial y de no residente, y la parte de un cónyuge en cualquier cosa.'
  fg-detail-019666:
    summary: ¿Empezó en otro dispositivo?
    p-e48b80: Elija el archivo de respuestas que descargó desde la pantalla de revisión. Reemplaza todo lo ingresado aquí
      con lo que contiene el archivo.
    button-4658a2: Reanudar desde un archivo
/your-taxes/virginia/virginia-known:
  title: Lo que Virginia ya tiene
  h2-a78825: Esto es lo que Virginia ya tiene
  p-2e7371: No necesita ingresar nada de esto. Está agrupado según quién se lo informó a Virginia. Revíselo en esta pantalla;
    la siguiente le pregunta si todo está bien, y una corrección llega a ambas declaraciones.
  table-0:
    caption-dfd760: <span class="va-source__title">Los registros propios de Virginia Tax</span> <span class="va-source__sub">Pagos
      que usted ya hizo a Virginia</span>
    tr-0:
      th-82966b: Pagos estimados hechos para <fg-show path="/taxYear"/> <span class="va-line">Línea 20</span>
      td-7876f6: <fg-show path="/vaEstimatedPayments"/>
    tr-1:
      th-a27314: Pago en exceso del año anterior aplicado <span class="va-line">Línea 21</span>
      td-cda2a4: <fg-show path="/vaPriorYearOverpaymentApplied"/>
    tr-2:
      th-770258: Pagos de prórroga <span class="va-line">Línea 22</span>
      td-f86689: <fg-show path="/vaExtensionPayments"/>
  p-6005e3: 'Registros de Virginia: se encontró una coincidencia'
  p-0c93ed: 'Un registro bajo su apellido y fecha de nacimiento completó las líneas 20 a 22 de arriba. Si falta un pago o
    está mal, dígalo en la siguiente pantalla: esas tres líneas se pueden corregir allí, y su corrección se conserva.'
  p-82266b: 'Registros de Virginia: no se encontró coincidencia'
  p-6128a1: No hay nada registrado bajo su apellido y fecha de nacimiento, así que las líneas 20 a 22 de arriba muestran $0.
    Si sí hizo un pago a Virginia, dígalo en la siguiente pantalla e ingréselo allí.
  table-1:
    caption-ad5e1f: <span class="va-source__title">Su empleador</span> <span class="va-source__sub">De los W-2 que presentó
      ante Virginia y el IRS</span>
    tr-0:
      th-c5c3ae: Salarios, todos los W-2 <span class="va-line">casilla 1</span>
      td-1a2421: <fg-show path="/wages"/>
    tr-1:
      th-7f7b1c: Impuesto de Virginia retenido, todos los W-2 <span class="va-line">casilla 17, Línea 19a</span>
      td-7490ed: <fg-show path="/vaWithholding"/>
  table-2:
    caption-2b8de5: <span class="va-source__title">Su declaración federal</span> <span class="va-source__sub">Las respuestas
      que dio en las secciones federales</span>
    tr-0:
      th-49ee30: Nombre
      td-5c6ab6: <fg-show path="/primaryFiler/firstName"/> <fg-show path="/primaryFiler/lastName"/>
    tr-1:
      th-4e867a: Estado civil para la declaración
      td-ba5388: <fg-show path="/filingStatus"/>
    tr-2:
      th-4965e9: Fecha de nacimiento
      td-6c194e: <fg-show path="/primaryFiler/dateOfBirth"/>
    tr-3:
      th-399365: Ingreso bruto ajustado federal <span class="va-line">Formulario 1040, línea 11</span>
      td-5637e9: <fg-show path="/agi"/>
    tr-4:
      th-e39b5b: Seguro Social sujeto a impuestos <span class="va-line">Formulario 1040, línea 6b</span>
      td-61057a: <fg-show path="/taxableSocialSecurityBenefits"/>
    tr-5:
      th-40f36e: Crédito por ingreso del trabajo <span class="va-line">Formulario 1040, línea 27</span>
      td-de474a: <fg-show path="/vaFederalEarnedIncomeCredit"/>
  p-452223: En un servicio administrado por el estado, los registros de Virginia Tax provienen de sus propios libros. Este
    prototipo los lee de un sustituto de esos registros, vinculado a usted por nombre y fecha de nacimiento, así que ya están
    completos cuando los ve. Se completan una sola vez; una corrección que usted les haga se conserva.
/your-taxes/virginia/virginia-check:
  title: ¿Está todo bien?
  h2-93487e: ¿Está todo bien en la pantalla anterior?
  p-023d45: Si algo está mal, dígalo aquí y lo llevaremos a corregirlo. Su declaración de Virginia y su declaración federal
    comparten los mismos datos, así que una corrección hecha aquí llega a ambas, y no se le volverá a preguntar.
  /vaEverythingRight:
    question: ¿Está todo bien?
    options:
      'true':
        name: Sí, todo está bien
      'false':
        name: No, algo necesita corrección
/your-taxes/virginia/virginia-correct-what:
  title: ¿Qué necesita corrección?
  h2-365996: ¿Qué necesita corrección?
  p-a27189: Elija una. Puede volver por otra. Los montos calculados, como su ingreso bruto ajustado, no se pueden editar;
    cambian cuando cambia aquello a partir de lo cual se calculan.
  /vaCorrectionTarget:
    question: ¿Qué necesita corrección?
    options:
      dateOfBirth:
        name: Mi fecha de nacimiento
      w2:
        name: Un W-2 de mi empleador
      records:
        name: Un pago que muestran los registros de Virginia (líneas 20 a 22)
/your-taxes/virginia/virginia-correct-dob:
  title: Corrija su fecha de nacimiento
  h2-ea2075: Corrija su fecha de nacimiento
  p-96b5bb: Tenemos <fg-show path="/primaryFiler/dateOfBirth"/>, de su declaración federal. <strong>Esto también actualiza
    su declaración federal.</strong> Virginia la usa para la deducción por edad y la exención de 65 años o más.
  /primaryFiler/dateOfBirth:
    question: Fecha de nacimiento correcta
/your-taxes/virginia/virginia-correct-w2:
  title: Corrija un W-2
  h2-6bbd7d: Corrija su W-2
  p-085bb9: <strong>Revise primero el W-2 en papel.</strong> Su empleador informó estas casillas al IRS y a Virginia. Si el
    W-2 en sí está mal, pida a su empleador uno corregido (un W-2c). Si cambia una casilla aquí sin uno, Virginia verá una
    diferencia con lo que envió su empleador y podría escribirle al respecto.
  p-4e20f8: 'Las casillas 1 y 2 también actualizan su declaración federal. Las casillas 16 y 17 son las que usa Virginia:
    sus salarios de Virginia y el impuesto ya retenido.'
  collection/formW2s:
    itemName: W-2
    /formW2s/*/employerName:
      question: Nombre del empleador
    /formW2s/*/writableWages:
      question: <strong>Casilla 1</strong> - Salarios, propinas, otra compensación
    /formW2s/*/writableFederalWithholding:
      question: <strong>Casilla 2</strong> - Impuesto federal sobre la renta retenido
    /formW2s/*/writableStateWages:
      question: <strong>Casilla 16</strong> - Salarios estatales, propinas, etc.
    /formW2s/*/writableStateWithholding:
      question: <strong>Casilla 17</strong> - Impuesto estatal sobre la renta retenido
    h3-953964: W-2 de <fg-show path="/formW2s/*/employerName"/>
/your-taxes/virginia/virginia-correct-records:
  title: Corrija un pago registrado
  h2-eab31a: Corrija un pago que muestran los registros de Virginia
  p-f61470: 'Las líneas 20 a 22 se completaron a partir del sustituto de los registros de Virginia Tax, bajo su apellido y
    fecha de nacimiento. Ingrese lo que realmente pagó; deje una línea en blanco para $0. Lo que ingrese aquí se conserva:
    los registros no se vuelven a leer para usted.'
  p-2c0dcf: En un servicio administrado por el estado, una diferencia con los libros propios de Virginia Tax se verificaría
    contra ellos antes de aceptar la declaración.
  /vaEstimatedPayments:
    question: Línea 20, pagos estimados hechos para <fg-show path="/taxYear"/>
    hint: El total de los pagos estimados que envió a Virginia Tax durante el año (Formulario 760ES).
  /vaPriorYearOverpaymentApplied:
    question: Línea 21, pago en exceso del año anterior aplicado a este año
    hint: La parte del reembolso de Virginia del año pasado que pidió que se acreditara a este año en lugar de pagarse.
  /vaExtensionPayments:
    question: Línea 22, pagos de prórroga
    hint: Lo que pagó con una solicitud de prórroga (Formulario 760IP).
/your-taxes/virginia/virginia-corrections:
  title: Su corrección
  h2-34a5ea: Su corrección quedó guardada. Esto es lo que cambió.
  p-97be3b: Comparando su declaración antes y después de la corrección.
  p-ac7c9a: <strong>Lo que no cambia.</strong> Todo lo demás que vio sigue igual, y nada de lo que ya respondió se le volverá
    a preguntar. Su declaración federal lleva la misma corrección. Para corregir otra cosa, vuelva a "¿Está todo bien?" y
    elija de nuevo.
/your-taxes/virginia/virginia-locality:
  title: ¿Dónde vivía el 1 de enero?
  p-c6665d: Pregunta 1 de 4
  h2-7336f9: ¿En qué ciudad o condado de Virginia vivía el 1 de enero de 2025?
  p-7ce7cf: El Formulario 760 pide su código de localidad. Virginia lo usa, en parte, para asignar fondos escolares locales.
    Su dirección indica una ciudad y un código postal, pero un código postal puede cruzar el límite de un condado y aquí se
    trata del 1 de enero, el día siguiente al año tributario, así que confírmelo.
  p-906b6c: 'Virginia no tiene impuesto local sobre la renta. Su lugar de residencia cambia una sola cosa en esta declaración:
    la tasa del impuesto sobre el uso en compras sin impuesto, que se pregunta tres pantallas más adelante.'
