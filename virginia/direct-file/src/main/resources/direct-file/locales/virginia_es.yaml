/your-taxes/virginia/virginia-military:
  title: Servicio militar
  p-9cf179: Pregunta 2 de 4
  h2-6b6a17: ¿Estuvo en las Fuerzas Armadas de los EE. UU. en 2024 o recibió una pensión de retiro militar?
  p-915d2b: Virginia no grava parte del sueldo básico de un miembro del servicio militar, ni hasta $30,000 de la pensión de
    retiro militar (Código de Virginia § 58.1-322.02(15) y (18)). Su W-2 y su 1099-R muestran el total, no qué parte es sueldo
    básico o retiro militar, así que solo usted puede decírnoslo.
  /vaHasMilitaryIncome:
    question: ¿Estuvo en las Fuerzas Armadas de los EE. UU. en 2024 o recibió una pensión de retiro militar?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  p-167016: 'Su estimación de Virginia hasta ahora: <strong>usted debe <fg-show path="/vaAmountYouOwe"/></strong>'
  p-b3021b: 'Su estimación de Virginia hasta ahora: <strong>un reembolso de <fg-show path="/vaRefund"/></strong>'
  p-ed1c54: 'Su estimación de Virginia hasta ahora: <strong>no debe nada y no hay reembolso</strong>'
  h2-64615f: ¿Estuvo en servicio activo más de 90 días seguidos en 2024?
  p-758664: Servicio activo prolongado en cualquier lugar, dentro o fuera de Virginia. Virginia resta hasta $15,000 del sueldo
    básico militar; la sustracción baja $1 por cada $1 de sueldo básico por encima de $15,000 y desaparece a los $30,000.
  /vaHasMilitaryBasicPay:
    question: ¿Estuvo en servicio activo prolongado durante más de 90 días consecutivos en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  h2-15f14e: ¿Cuánto sueldo básico militar recibió en 2024?
  p-ff098b: Solo el sueldo básico, según sus estados de licencias y ganancias (LES). No incluya las asignaciones de vivienda
    y alimentación, las bonificaciones ni las pagas especiales; la casilla 1 de su W-2 incluye algunas de ellas, por lo que
    suele ser mayor que su sueldo básico.
  /vaMilitaryBasicPay:
    question: Sueldo básico militar recibido en 2024
    hint: Cuentan hasta $30,000. Se resta todo hasta $15,000; por encima, la sustracción baja $1 por cada $1 de sueldo, y
      a los $30,000 no se resta nada.
  p-69ea01: 'Con <fg-show path="/vaMilitaryBasicPay"/> de sueldo básico la sustracción es $0: termina en <fg-show path="/vaMilitaryBasicPayMaximum"/>.
    La respuesta queda registrada de todos modos y nada más cambia en su declaración.'
  h2-e8c2b2: ¿Recibió una pensión de retiro militar o pagos del Plan de Beneficios para Sobrevivientes (SBP) en 2024?
  p-e6e6f4: Pensión de retiro por servicio en las Fuerzas Armadas de los EE. UU., o beneficios que recibe como cónyuge sobreviviente
    de un veterano. Para 2024, Virginia no grava hasta $30,000, a cualquier edad.
  /vaHasMilitaryRetirement:
    question: ¿Recibió una pensión de retiro militar o pagos del Plan de Beneficios para Sobrevivientes (SBP) en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  h2-7c0a04: ¿Cuánto de eso fue tributable?
  p-b62b0f: La cantidad tributable de la casilla 2a del 1099-R del Servicio de Finanzas y Contabilidad de Defensa (DFAS),
    sumada si tiene más de uno.
  /vaMilitaryRetirementIncome:
    question: Retiro militar y beneficios para sobrevivientes tributables recibidos en 2024
    hint: Cuentan hasta $30,000, y no más que la cantidad tributable de sus 1099-R.
  p-3f67c2: De los <fg-show path="/vaMilitaryRetirementIncome"/> que ingresó, <fg-show path="/vaMilitaryBenefitsMaximum"/>
    es lo máximo que Virginia resta para 2024. El resto sigue siendo tributable.
/your-taxes/virginia/virginia-savers:
  title: Aportes a Commonwealth Savers
  p-1f4216: Pregunta 3 de 4
  h2-b7e29e: ¿Aportó dinero a una cuenta Commonwealth Savers (Virginia529) en 2024?
  p-f42bed: Commonwealth Savers es el plan de ahorro universitario del estado. Los aportes son deducibles en la línea 13,
    hasta $4,000 por cuenta al año, salvo que haya cumplido 70 años (Código de Virginia § 58.1-322.03(7)). El plan no informa
    nada al IRS, así que solo usted puede decírnoslo.
  /vaHasCommonwealthSaversContributions:
    question: ¿Aportó a una cuenta Commonwealth Savers en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  p-167016: 'Su estimación de Virginia hasta ahora: <strong>usted debe <fg-show path="/vaAmountYouOwe"/></strong>'
  p-b3021b: 'Su estimación de Virginia hasta ahora: <strong>un reembolso de <fg-show path="/vaRefund"/></strong>'
  p-ed1c54: 'Su estimación de Virginia hasta ahora: <strong>no debe nada y no hay reembolso</strong>'
  h2-44b450: ¿Cuánto aportó en 2024?
  p-170c80: Ingrese el total. La deducción tiene un tope de $4,000 salvo que haya cumplido 70; en una declaración real, lo
    que supere ese tope se trasladaría a años posteriores.
  /vaCommonwealthSaversContributions:
    question: Monto aportado a cuentas Commonwealth Savers
    hint: Se deducen hasta $4,000, salvo que tenga 70 años o más, en cuyo caso se deduce todo.
  p-8cd295: De los <fg-show path="/vaCommonwealthSaversContributions"/> que ingresó, <fg-show path="/vaCommonwealthSaversCap"/>
    se deducen este año. En una declaración real, el resto se trasladaría a años posteriores.
/your-taxes/virginia/virginia-use-tax:
  title: Compras sin impuesto
  p-aa276e: Pregunta 4 de 4
  h2-15bb3c: ¿Compró algo en 2024 sin pagar el impuesto sobre las ventas de Virginia?
  p-246296: 'Por internet, por correo o en otro estado, donde el vendedor no cobró impuesto de Virginia. Virginia se lo pregunta
    a todos los declarantes (línea 33, impuesto sobre el uso). Ningún vendedor lo informa, así que la respuesta tiene que
    ser suya. Su lugar de residencia fija la tasa: 5.3% en la mayor parte de Virginia, 6% en el norte de Virginia, Hampton
    Roads y la región de Richmond, 6.3% o 7% en unas pocas localidades.'
  /vaHasUntaxedPurchases:
    question: ¿Compró algo sin pagar el impuesto sobre las ventas de Virginia en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: No, nada sin impuesto
  p-167016: 'Su estimación de Virginia hasta ahora: <strong>usted debe <fg-show path="/vaAmountYouOwe"/></strong>'
  p-b3021b: 'Su estimación de Virginia hasta ahora: <strong>un reembolso de <fg-show path="/vaRefund"/></strong>'
  p-ed1c54: 'Su estimación de Virginia hasta ahora: <strong>no debe nada y no hay reembolso</strong>'
  h2-bbde4b: ¿Cuánto sumaron esas compras?
  p-93d1c0: El envío facturado por separado no está sujeto a impuesto. Su impuesto sobre el uso es este total multiplicado
    por la tasa del <fg-show path="/vaUseTaxRatePercent"/>% de <fg-show path="/vaLocalityName"/>, redondeado al dólar.
  /vaUntaxedPurchases:
    question: Total de compras por las que no se pagó impuesto sobre las ventas de Virginia
    hint: El precio total de las cosas que compró sin pagar impuesto sobre las ventas, tal como lo cobraron los vendedores,
      sin contar el envío facturado por separado.
  p-6419f5: 'Impuesto sobre el uso de <fg-show path="/vaUntaxedPurchases"/> al <fg-show path="/vaUseTaxRatePercent"/>% para
    <fg-show path="/vaLocalityName"/>: <strong><fg-show path="/vaUseTax"/></strong>'
