# This application's own strings.
#
# The chrome the scaffold's templates need — components.*, errors.*, buttons.*, step-indicator.*,
# layout.banner.*, layout.identifier.* — ships with gov.irs::form-builder. Lookup is app first, then
# the library, then the generated flow locale, so declaring a key here overrides the library's
# without copying the rest of it.
#
# Authored text from flow/*.xml is *not* written here: it is extracted to flow_en.yaml on every
# build. Do not edit that file by hand.
title:
  prefix: Direct File
  suffix: Internal Revenue Service
layout:
  title: Direct File

# Section headings for the Browse All / Path Mode listing: one key per flow module, keyed by its
# filename in flow/. Add a module to flow/index.xml, add its heading here — a missing one renders as
# the key itself, and `make transpile` fails rather than letting that ship.
#
# Every string below is Direct File's own `checklist.{subcategoryRoute}.heading`, because a flow
# module here *is* one of its subcategories. They are copied rather than generated: the transpiler
# owns flow/ and facts/flowGates.xml, and this is a hand-written file the port does not overwrite.
#
# `income-retirement-launch` and `income-retirement` deliberately read the same. Upstream writes the
# first as `$t(checklist./flow/income/retirement.heading)` — one section entered from two places —
# and inventing a distinguishing word here would be this port editorialising.
all-screens:
  section:
    you-and-your-family-about-you: About you
    you-and-your-family-spouse: Spouse
    you-and-your-family-dependents: Family and household
    you-and-your-family-filing-status: Filing status
    income-income-sources: Income sources
    income-jobs: Jobs
    income-unemployment: Unemployment compensation
    income-interest: Interest income
    income-alaska-pfd: Alaska Permanent Fund Dividend
    income-dependent-care: Dependent care benefits
    income-hsa: Health Savings Accounts
    income-retirement-launch: Retirement income (Form 1099-R)
    income-retirement: Retirement income (Form 1099-R)
    income-social-security: Social Security benefits (Form SSA-1099)
    income-total-income-summary: Total income
    credits-and-deductions-deductions: Deductions
    credits-and-deductions-credits: Credits
    your-taxes-estimated-taxes-paid: Estimated taxes paid
    your-taxes-amount: Amount
    your-taxes-payment-method: Payment method
    your-taxes-other-preferences: Other preferences
    your-taxes-virginia: Your Virginia return
    complete-review: Review and confirm
    complete-sign-and-submit: Federal tax return digital signature
    complete-print-and-mail: Print and mail
    complete-submit: Submit
    other: Other

# Everything the Taxpert workspace shows. Nothing below reaches a taxpayer — the workspace is only
# built into an --auditMode site — but it is still per-locale, because a translator working in
# Spanish should be able to read the tool they are working in.
workspace:
  flags:
    ai-scenario-generation: AI scenario generation
    ai-fact-explanation: AI fact explanations
    author-mode: Author Mode
  tools:
    inspect: Inspect
    inspect-description: Inspect facts, flows and text.
    outcome-tracker: Outcome tracker
    outcome-tracker-description: Track the outcomes this application determines.
    watchlist: Watchlist
    watchlist-description: Track the value of one or more facts as you work or load scenarios.

  # The five outcomes in website-static/js/taxpert/direct-file-graph.js, in the order they appear
  # there. A return is one outcome — refund or balance owed — and each of the four credits that can
  # move it is another, because "why is this number what it is" is the question the Outcome tracker
  # exists to answer.
  outcomes:
    return: Refund or amount owed
    refund-due: Refund due
    balance-owed: Balance owed
    income-and-tax: Income and tax
    payments-and-credits: Payments and credits
    the-result: The result

    eitc: Earned Income Tax Credit
    qualifies: Qualifies
    does-not-qualify: Does not qualify
    eitc-eligibility: Eligibility
    eitc-amount: Amount

    ctc-odc: Child Tax Credit and Credit for Other Dependents
    ctc-odc-eligibility: Eligibility
    ctc-odc-amount: Amount

    cdcc: Child and Dependent Care Credit
    receiving: Receiving the credit
    not-receiving: Not receiving the credit
    cdcc-eligibility: Eligibility
    cdcc-amount: Amount

    ptc: Premium Tax Credit
    ptc-eligibility: Eligibility
    ptc-amount: Amount

# The seven custom input types this application registers (Main.scala's `inputTypes`), and the words
# their templates need. Every string below is Direct File's own — the field labels from
# `fields.generics.address` and `fields./bankAccount`, the state names from `enums.statesAndProvinces`
# and `enums.armedForces`, and each `invalid` from that type's own `errorMessages` entry — so the port
# says what upstream says rather than paraphrasing it.
#
# `invalid` is one message per type rather than one per failure reason. The browser handlers build
# the value with the Fact Graph's own factory and get back a JSEither whose Left is a typed reason,
# but `fg-set` has no place to put a per-reason message for a value it never sees as a string (see
# website-static/js/inputs/masked-number.js). One accurate sentence beats a reason code.
#
# AE appears four times in the state list on purpose: upstream offers Africa, Canada, Europe and the
# Middle East separately over the one code the Fact Graph stores.
inputs:
  tin:
    invalid: Enter a valid number. This should look like 123-45-6789
  ein:
    invalid: Enter a valid EIN. This should look like 12-3456789
  pin:
    invalid: PIN must be 5 digits long
  ip-pin:
    invalid: PIN must be 6 digits long
  phone-number:
    invalid: This should look like 212-555-0134
  collection-item-reference:
    # An option whose naming facts are all still unanswered. Upstream renders a radio with nothing
    # beside it; a word is better than a blank, and it has to be translated like any other.
    unnamed: This entry
  address:
    country: Country
    street: Address
    street2: Address line 2
    city: City
    state: State or military post
    zip: ZIP code
    invalid: The ZIP code must be in the format of 12345 or 12345-1234 or 12345-1234567
    states:
      AL: Alabama
      AK: Alaska
      AZ: Arizona
      AR: Arkansas
      CA: California
      CO: Colorado
      CT: Connecticut
      DE: Delaware
      DC: District of Columbia
      FL: Florida
      GA: Georgia
      HI: Hawaii
      ID: Idaho
      IL: Illinois
      IN: Indiana
      IA: Iowa
      KS: Kansas
      KY: Kentucky
      LA: Louisiana
      ME: Maine
      MD: Maryland
      MA: Massachusetts
      MI: Michigan
      MN: Minnesota
      MS: Mississippi
      MO: Missouri
      MT: Montana
      NE: Nebraska
      NV: Nevada
      NH: New Hampshire
      NJ: New Jersey
      NM: New Mexico
      NY: New York
      NC: North Carolina
      ND: North Dakota
      OH: Ohio
      OK: Oklahoma
      OR: Oregon
      PA: Pennsylvania
      RI: Rhode Island
      SC: South Carolina
      SD: South Dakota
      TN: Tennessee
      TX: Texas
      UT: Utah
      VT: Vermont
      VA: Virginia
      WA: Washington
      WV: West Virginia
      WI: Wisconsin
      WY: Wyoming
      armedForcesAmericas: AA - Armed Forces Americas
      armedForcesAfrica: AE - Armed Forces Africa
      armedForcesCanada: AE - Armed Forces Canada
      armedForcesEurope: AE - Armed Forces Europe
      armedForcesMiddleEast: AE - Armed Forces Middle East
      armedForcesPacific: AP - Armed Forces Pacific
  bank-account:
    checking: Checking
    savings: Savings
    routingNumber: Routing number
    accountNumber: Account number
    invalid: Not a valid routing number

# The Virginia section's own chrome: the masthead and the five-step track that replace the IRS
# header and the federal step indicator on /your-taxes/virginia/ routes. See
# templates/fragments/va-masthead.html; the design is the virginia-theme mockup in the repository's report/mockups/.
virginia:
  demo:
    label: Demonstration
    text: A class prototype. Not a Virginia Tax service. Nothing is filed.
  masthead:
    kicker: Commonwealth of Virginia
    name: Virginia State Return
    federal: Federal answers
    federal-status: Complete
    language: Select Language
  track:
    label: Your Virginia return
    federal: Federal answers
    known: What Virginia knows
    answers: Your answers
    review: Review
    sign: Sign
    done: completed
    current: current step
  footer:
    label: Virginia State Return
    identity: Virginia State Return, a class prototype
    disclaimer: >-
      Built for a graduate course to show how a Virginia return could follow on from Direct File.
      It is not run by or affiliated with Virginia Tax or the Commonwealth of Virginia, and nothing
      entered here is filed.
    links: Where to get help
    state-help: Virginia Tax, for questions about a real Virginia return
    federal-help: IRS, for questions about your federal return
  # The words website-static/js/virginia-*.js show, rendered into <template id="va-strings"> by
  # templates/fragments/js-templates.html per language. {0}, {1} are filled in by the script.
  ui:
    corrections:
      same: "What you owe did not change: {0}."
      changed: "Now {0}. Before this correction, {1}."
      owe: you owe {0}
      refund: your refund is {0}
      nothing: you owe nothing
      none: "—"
      caption: What you corrected
      col-item: Item
      col-was: Was
      col-now: Now
      nothing-changed: Nothing changed. The values you saved are the ones we already had.
      dob: Date of birth
      dob-note: Also corrected on your federal return.
      records-note: Virginia Tax would compare this with its own books.
      w2-from: W-2 from {0}
      your-employer: your employer
      w2-note: Virginia will compare this with the W-2 your employer filed.
      w2-federal-note: Also corrected on your federal return. Virginia will compare this with the W-2 your employer filed.
      lines-one: One line on Form 760 changed
      lines-many: "{0} lines on Form 760 changed"
      no-line-changed: No line on Form 760 changed.
      no-round: No correction was made in this round, so there is nothing to compare.
      to: to
    line:
      "1": Line 1, federal adjusted gross income
      "4": Line 4, age deduction
      "9": Line 9, Virginia adjusted gross income
      "11": Line 11, standard deduction
      "12": Line 12, exemptions
      "15": Line 15, Virginia taxable income
      "16": Line 16, Virginia income tax
      19a: Line 19a, Virginia tax withheld
      "20": Line 20, estimated payments
      "21": Line 21, last year's overpayment applied
      "22": Line 22, extension payments
      "23": Line 23, credit for low-income workers and families
      "27": Line 27, tax you owe before use tax
      "28": Line 28, your overpayment
      "35": Line 35, amount you owe
      "36": Line 36, your refund
    records:
      "20": Line 20, estimated payments Virginia had on record
      "21": Line 21, last year's overpayment Virginia had on record
      "22": Line 22, extension payments Virginia had on record
    w2:
      employer: Employer
      box1: Box 1, wages
      box2: Box 2, federal tax withheld
      box16: Box 16, Virginia wages
      box17: Box 17, Virginia tax withheld
    sign:
      need-declaration: Check the declaration box first. Virginia Tax cannot accept an unsigned return.
    save:
      filename: virginia-return-answers.json
      resume-error: That file is not an answers file from this prototype. Download one from the review screen and choose it here.
