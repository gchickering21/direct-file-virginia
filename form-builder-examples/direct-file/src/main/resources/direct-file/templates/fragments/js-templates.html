<!--/* The scaffold's js-templates, verbatim, plus the Virginia section's footer and the strings its scripts show.

       WHY THE FOOTER IS HERE. The scaffold's footer (the IRS identifier) sits inline in page.html, so it
       cannot be replaced from an application, and the handoff ships this directory only, so page.html
       is not ours to change. This fragment is the first overridable one after the footer, so on
       /your-taxes/virginia/ routes it draws a Virginia footer there, and styles/components/virginia.css
       hides the IRS one with `body:has(.va-masthead)`, the same switch as the header. One <footer>
       is ever displayed, so the page keeps a single contentinfo landmark.

       If the scaffold ever makes the footer a fragment, override that instead and drop this. */-->
<template id="validate-alert-template">
  <div class="usa-alert usa-alert--error validate-alert" role="alert">
    <div class="usa-alert__body">
      <p class="usa-alert__text" id="alert-message" th:text="#{alerts.warning.complete-required}"></p>
    </div>
  </div>
</template>
<th:block th:if="${currentPageRoute != null and #strings.startsWith(currentPageRoute, '/your-taxes/virginia/')}">
<!--/* The words the Virginia scripts (website-static/js/virginia-*.js) show, rendered per language
       from the virginia.ui.* keys so that a script never carries English onto the Spanish site.
       Read by js/virginia-strings.js: each span's data-va is the key, its text the string; {0}, {1}
       are filled in by the script. */-->

<footer class="va-footer" th:aria-label="#{virginia.footer.label}">
    <div class="va-footer__inner">
        <div class="va-footer__identity">
            <svg class="va-footer__emblem" viewBox="0 0 100 100" width="36" height="36" aria-hidden="true" focusable="false">
                <g transform="translate(50 50)">
                    <g id="va-footer-petal">
                        <path d="M0 -6 C 14 -14, 18 -36, 4 -44 C 2 -40, -2 -40, -4 -44 C -18 -36, -14 -14, 0 -6 Z" fill="currentColor"/>
                    </g>
                    <use href="#va-footer-petal" transform="rotate(90)"/>
                    <use href="#va-footer-petal" transform="rotate(180)"/>
                    <use href="#va-footer-petal" transform="rotate(270)"/>
                    <circle r="8" fill="#e57200"/>
                </g>
            </svg>
            <div>
                <p class="va-footer__name" th:text="#{virginia.footer.identity}"></p>
                <p class="va-footer__disclaimer" th:text="#{virginia.footer.disclaimer}"></p>
            </div>
        </div>
        <nav class="va-footer__links" th:aria-label="#{virginia.footer.links}">
            <ul>
                <li><a class="usa-link" href="https://www.tax.virginia.gov/" target="_blank" rel="noopener" th:text="#{virginia.footer.state-help}"></a></li>
                <li><a class="usa-link" href="https://www.irs.gov/" target="_blank" rel="noopener" th:text="#{virginia.footer.federal-help}"></a></li>
            </ul>
        </nav>
    </div>
</footer>
