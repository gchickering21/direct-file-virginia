/your-taxes/virginia/virginia-lottery:
  title: Premios de la Lotería de Virginia
  h2-40b8da: ¿Ganó un premio de la Lotería de Virginia de menos de $600 en 2024?
  p-37fe58: Virginia no grava los premios de menos de $600, pero su declaración federal los cuenta como ingreso, así que Virginia
    los resta en la línea 7 (Código de Virginia § 58.1-322.02(7)). Los premios de $600 o más se informan a Virginia y siguen
    siendo gravables. Nadie informa los pequeños, así que solo usted puede decírnoslo.
  /vaHasLotteryPrizesUnder600:
    question: ¿Ganó un premio de la Lotería de Virginia de menos de $600 en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  h2-6a5fdf: ¿Cuánto sumaron esos premios?
  p-74957d: Cuente solo los premios que fueron, cada uno, de menos de $600.
  /vaLotteryPrizesUnder600:
    question: Total de premios de la Lotería de Virginia de menos de $600
/your-taxes/virginia/virginia-savers:
  title: Aportes a Commonwealth Savers
  h2-b7e29e: ¿Aportó dinero a una cuenta Commonwealth Savers (Virginia529) en 2024?
  p-f42bed: Commonwealth Savers es el plan de ahorro universitario del estado. Los aportes son deducibles en la línea 13,
    hasta $4,000 por cuenta al año, salvo que haya cumplido 70 años (Código de Virginia § 58.1-322.03(7)). El plan no informa
    nada al IRS, así que solo usted puede decírnoslo.
  /vaHasCommonwealthSaversContributions:
    question: ¿Aportó a una cuenta Commonwealth Savers en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: 'No'
  h2-44b450: ¿Cuánto aportó en 2024?
  p-170c80: Ingrese el total. La deducción tiene un tope de $4,000 salvo que haya cumplido 70; en una declaración real, lo
    que supere ese tope se trasladaría a años posteriores.
  /vaCommonwealthSaversContributions:
    question: Monto aportado a cuentas Commonwealth Savers
/your-taxes/virginia/virginia-use-tax:
  title: Compras sin impuesto
  h2-15bb3c: ¿Compró algo en 2024 sin pagar el impuesto sobre las ventas de Virginia?
  p-246296: 'Por internet, por correo o en otro estado, donde el vendedor no cobró impuesto de Virginia. Virginia se lo pregunta
    a todos los declarantes (línea 33, impuesto sobre el uso). Ningún vendedor lo informa, así que la respuesta tiene que
    ser suya. Su lugar de residencia fija la tasa: 5.3% en la mayor parte de Virginia, 6% en el norte de Virginia, Hampton
    Roads y la región de Richmond, 6.3% o 7% en unas pocas localidades.'
  /vaHasUntaxedPurchases:
    question: ¿Compró algo sin pagar el impuesto sobre las ventas de Virginia en 2024?
    options:
      'true':
        name: Sí
      'false':
        name: No, nada sin impuesto
  h2-bbde4b: ¿Cuánto sumaron esas compras?
  p-7e719b: El envío facturado por separado no está sujeto a impuesto. Su impuesto sobre el uso es este total multiplicado
    por la tasa de su localidad.
  /vaUntaxedPurchases:
    question: Total de compras por las que no se pagó impuesto sobre las ventas de Virginia
/your-taxes/virginia/virginia-summary:
  title: Formulario 760, calculado a partir de su declaración federal
  h2-59ac58: Formulario 760, calculado a partir de su declaración federal
  p-c58539: <strong>Solo demostración.</strong> Año tributario <fg-show path="/taxYear"/>. Cada línea indica la ley de la
    que proviene. Código de localidad <fg-show path="/vaLocalityCode"/>.
  table-0:
    caption-01cbec: Formulario 760 de Virginia
    tr-0:
      th-04a085: Línea 1, ingreso bruto ajustado federal
      td-515411: <fg-show path="/vaFederalAdjustedGrossIncome"/>
    tr-1:
      th-b978c1: Línea 4, deducción por edad (§ 58.1-322.03(5))
      td-f3ab4c: <fg-show path="/vaAgeDeduction"/>
    tr-2:
      th-d8d6dc: Línea 5, beneficios del Seguro Social sujetos a impuesto (§ 58.1-322.02(3))
      td-abf769: <fg-show path="/vaTaxableSocialSecurityBenefits"/>
    tr-3:
      th-93e678: Línea 7, premios de la Lotería de Virginia de menos de $600 (§ 58.1-322.02(7))
      td-7e51b0: <fg-show path="/vaLotterySubtraction"/>
    tr-4:
      th-972c17: Línea 9, ingreso bruto ajustado de Virginia
      td-99617f: <fg-show path="/vaAdjustedGrossIncome"/>
    tr-5:
      th-48eb27: Línea 11, deducción estándar (§ 58.1-322.03(1)(b))
      td-dc74d3: <fg-show path="/vaStandardDeduction"/>
    tr-6:
      th-04749f: Línea 12, exenciones (§ 58.1-322.03(2))
      td-8e526f: <fg-show path="/vaExemptions"/>
    tr-7:
      th-d67f52: Línea 13, deducción por Commonwealth Savers (§ 58.1-322.03(7))
      td-708538: <fg-show path="/vaCommonwealthSaversDeduction"/>
    tr-8:
      th-d13cb7: Línea 15, ingreso tributable de Virginia
      td-3e5ed4: <fg-show path="/vaTaxableIncome"/>
    tr-9:
      th-c1e615: Línea 16, impuesto sobre la renta de Virginia (§ 58.1-320)
      td-436298: <strong><fg-show path="/vaTax"/></strong>
    tr-10:
      th-0e3156: Línea 19a, impuesto de Virginia retenido (casilla 17 del W-2)
      td-7490ed: <fg-show path="/vaWithholding"/>
    tr-11:
      th-ae6105: Líneas 20 a 22, pagos que Virginia Tax tiene registrados
      td-0b57f5: <fg-show path="/vaEstimatedPayments"/> + <fg-show path="/vaPriorYearOverpaymentApplied"/> + <fg-show path="/vaExtensionPayments"/>
    tr-12:
      th-06abe0: Línea 27, impuesto que debe antes del impuesto sobre el uso
      td-2aa488: <fg-show path="/vaTaxYouOwe"/>
    tr-13:
      th-f67e8a: Línea 28, su pago en exceso
      td-9388e0: <fg-show path="/vaOverpayment"/>
    tr-14:
      th-7c65a0: Línea 33, impuesto sobre el uso
      td-f778b5: <fg-show path="/vaUseTax"/>
    tr-15:
      th-684211: Línea 35, monto que debe
      td-71d917: <strong><fg-show path="/vaAmountYouOwe"/></strong>
    tr-16:
      th-5e20c2: Línea 36, su reembolso
      td-b4b35d: <strong><fg-show path="/vaRefund"/></strong>
  p-50775c: Su ingreso bruto ajustado de Virginia está por debajo del umbral de presentación para su estado civil (§ 58.1-321),
    por lo que su impuesto sobre la renta de Virginia es $0.
  p-76dc46: <strong>Antes de que alguien presente esto.</strong> El Formulario 760 se firma bajo pena de ley como verdadero,
    correcto y completo. Virginia Tax compara los salarios y la retención del W-2 en una declaración con lo que informó el
    empleador. Las cuatro respuestas anteriores no pueden cotejarse con ningún informe; por eso se preguntan y se firman.
  p-0b6cdd: Las líneas que no se muestran están fuera del alcance de este prototipo y se toman como $0. Nada de esto se presenta.
