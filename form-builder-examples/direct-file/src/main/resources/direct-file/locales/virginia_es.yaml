# Spanish for the Virginia screens, hand-written. flow_es.yaml is generated from Direct File's
# own Spanish by `make transpile-es` and knows nothing about Virginia, so this file is merged into
# it by scripts/merge-virginia-es.py. Keys are form-builder's, content-addressed on the English
# words in flow_en.yaml: change the English and the key changes, so re-copy it here. Locality names
# are proper nouns and stay as they are.
/your-taxes/virginia/virginia-intro:
  title: Su declaración de Virginia
  h2-b96767: Su declaración de Virginia
  p-45ca08: <strong>Solo demostración.</strong> Este es un proyecto de clase que muestra cómo una declaración estatal podría
    calcularse a partir de la declaración federal con el código publicado por el IRS. No es un servicio del IRS ni de Virginia
    Tax y no presenta nada.
  p-7524bb: <fg-show path="/primaryFiler/firstName"/>, como vivió en Virginia durante todo <fg-show path="/taxYear"/>, la
    mayor parte de su declaración de Virginia ya está hecha. El Formulario 760 parte de su declaración federal, su empleador
    ya envió su W-2 a Virginia y Virginia Tax ya tiene registrado lo que usted ha pagado. La siguiente pantalla muestra lo
    que ya se sabe. Después, cuatro preguntas que nadie declara por usted, y luego su declaración.
  p-dfa3b3: 'Lo que cubre este prototipo: la deducción estándar, las exenciones, la deducción por edad, el umbral de presentación,
    la tabla de tasas, la retención, dos partidas del Anexo ADJ (premios de lotería y aportes a Commonwealth Savers), el código
    de localidad y el impuesto sobre el uso (Código de Virginia §§ 58.1-320, 58.1-321, 58.1-322.02, 58.1-322.03). Lo que deja
    fuera: deducciones detalladas, las demás adiciones y sustracciones, todos los créditos, declaraciones de residente parcial
    y de no residente, y la parte de un cónyuge en cualquier cosa.'
/your-taxes/virginia/virginia-known:
  title: Lo que ya se sabe
  h2-5baf3a: Lo que ya se sabe
  p-166bcc: Agrupado según su origen. Estos son los datos con los que se calcula su declaración de Virginia. Para corregir
    uno, vuelva a la pantalla donde lo ingresó; la corrección llega a ambas declaraciones.
  table-0:
    caption-e82ee3: De su declaración federal
    tr-0:
      th-49ee30: Nombre
      td-5c6ab6: <fg-show path="/primaryFiler/firstName"/> <fg-show path="/primaryFiler/lastName"/>
    tr-1:
      th-4e867a: Estado civil para la declaración
      td-ba5388: <fg-show path="/filingStatus"/>
    tr-2:
      th-4965e9: Fecha de nacimiento
      td-6c194e: <fg-show path="/primaryFiler/dateOfBirth"/>
    tr-3:
      th-4995ba: Ingreso bruto ajustado federal (Formulario 1040, línea 11)
      td-5637e9: <fg-show path="/agi"/>
    tr-4:
      th-030f2a: Seguro Social sujeto a impuesto (línea 6b)
      td-61057a: <fg-show path="/taxableSocialSecurityBenefits"/>
  table-1:
    caption-06043f: De los W-2 que su empleador presentó ante el IRS y ante Virginia
    tr-0:
      th-017c12: Casilla 1, salarios, todos los W-2
      td-1a2421: <fg-show path="/wages"/>
    tr-1:
      th-b480cb: Casilla 17, impuesto de Virginia retenido, todos los W-2 (línea 19a)
      td-7490ed: <fg-show path="/vaWithholding"/>
  table-2:
    caption-be46ff: De los registros de Virginia Tax
    tr-0:
      th-6d2a34: Pagos estimados hechos para <fg-show path="/taxYear"/> (línea 20)
      td-7876f6: <fg-show path="/vaEstimatedPayments"/>
    tr-1:
      th-d21ba1: Pago en exceso del año pasado aplicado (línea 21)
      td-cda2a4: <fg-show path="/vaPriorYearOverpaymentApplied"/>
    tr-2:
      th-62361b: Pagos con prórroga (línea 22)
      td-f86689: <fg-show path="/vaExtensionPayments"/>
  p-8beb68: En un servicio del estado, los tres últimos vienen de los libros de Virginia Tax. Este prototipo no tiene conexión
    con ellos, así que se muestran como $0.
/your-taxes/virginia/virginia-locality:
  title: ¿Dónde vivía el 1 de enero?
  h2-f59a8d: ¿En qué ciudad o condado vivía el 1 de enero de 2025?
  p-7ce7cf: El Formulario 760 pide su código de localidad. Virginia lo usa, en parte, para asignar fondos escolares locales.
    Su dirección indica una ciudad y un código postal, pero un código postal puede cruzar el límite de un condado y aquí se
    trata del 1 de enero, el día siguiente al año tributario, así que confírmelo.
  p-ae5dac: 'Virginia no tiene impuesto local sobre la renta. Su lugar de residencia cambia una sola cosa en esta declaración:
    la tasa del impuesto sobre el uso en compras sin impuesto, que se pregunta dos pantallas más adelante.'
