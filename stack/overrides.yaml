# Local-development overrides for the IRS compose file, kept outside the IRS tree so the
# tree stays byte-for-byte upstream. Passed by the Makefile as a second -f file.
services:
  redis:
    # The IRS file publishes Redis on the host at 6379, which collides with any other
    # Redis on the machine. The API reaches Redis over the compose network; no host port
    # is needed.
    ports: !reset []
  localstack:
    # The IRS file pulls the floating 'latest' tag. Since late 2026 that image is a
    # licensed product and exits with code 55 without a paid token. The newest 4.x
    # community release, from LocalStack's free line, runs the init scripts as before.
    image: localstack/localstack:4.12
  csp-simulator:
    # The simulator proxies to the client's Vite dev server on the host as
    # host.docker.internal. Vite 5.4.12+ (a 2025 security fix) rejects any Host it was
    # not told about, and this Vite has no way to add one from outside the IRS config.
    # Vite does allow every *.localhost name, so the simulator reaches the host under one.
    environment:
      CSPSIM_CLIENT_BASE_URL: "http://client.localhost:${DF_FE_PORT:-3000}"
    extra_hosts:
      - "client.localhost:host-gateway"
