# CI for the Virginia return on the IRS's port of Direct File (form-builder-examples/direct-file).
#
# Five jobs, from cheap to dear:
#   check           the checks that need no JVM and no built site: xmllint, the IRS's template and
#                   JS linters, the Virginia rule scripts, the doc counts, the workbench examples
#   scala           publish the IRS libraries from the subtrees, the port's ScalaTest suite, the
#                   production site, and a developer-surface build of it for the browser job
#   browser         the 28 households and the axe pass, driven against that build with the pinned
#                   Playwright in stack/browser-tools
#   handoff-verify  the patch series against a fresh clone of the IRS repository at the pin
#                   (push to main and weekly, since it depends on GitHub rather than on this tree)
#   docker          the port's prod-like image, nightly and on request, so a broken Dockerfile or
#                   a stale compose context is found before someone's first `make port-up`
#
# Every command is one the root Makefile has a target for, so a red job reproduces locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Monday 06:17 UTC: handoff-verify
    - cron: '23 4 * * *'   # nightly 04:23 UTC: docker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PORT: form-builder-examples/direct-file
  NODE_VERSION: '22'

jobs:

  # ── check: no JVM, no site ──────────────────────────────────────────────────────────────────
  # validate-xml is xmllint over the two RELAX NG schemas; validate-templates is awk; validate-js
  # is the eslint the resources package.json carries. None needs sbt, so this job answers in a
  # minute or two.
  check:
    name: Checks without a site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (scripts/merge-virginia-es.py)
        run: python3 -m pip install --quiet pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PORT }}/src/main/resources/direct-file/package-lock.json
      - name: Install the resource linters
        run: npm ci --prefix ${{ env.PORT }}/src/main/resources/direct-file

      - name: The IRS's own lint targets (templates, JavaScript)
        run: make -C ${{ env.PORT }} validate-templates validate-js

      - name: The Virginia checks (schemas, export rule, constants, Spanish keys, doc counts, fact paths in the docs, workbench)
        run: make ci-local

  # ── scala: the libraries, the tests, the site ───────────────────────────────────────────────
  # `make port-bootstrap` does what a fresh clone needs: publish fact-graph and form-builder to
  # the local Ivy cache from the subtrees, install the port's npm dependencies, vendor the engine
  # bundle, the Taxpert UI and USWDS. Then the port's suite and its production build.
  scala:
    name: Libraries, tests, site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The download caches only. ~/.ivy2/local, where publishLocal writes, is rebuilt from the
      # subtrees every run, so a change to a library never serves a stale artifact.
      - name: Cache sbt and coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('fact-graph/project/build.properties', 'form-builder/project/build.properties', 'form-builder-examples/direct-file/project/build.properties', 'fact-graph/build.sbt', 'form-builder/build.sbt', 'form-builder-examples/direct-file/build.sbt', 'IRS_PINS.md') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Bootstrap (publish fact-graph and form-builder, npm installs, vendor assets)
        run: make port-bootstrap

      - name: The port's ScalaTest suite and scalafmt check
        run: make port-test

      - name: The production site (what the Docker image ships)
        run: make port-site

      # The browser checks drive the Scenario modal, which `make site` deliberately leaves out
      # (it is a developer surface). Regenerate ./out with the flags `make dev` uses, minus the
      # two AI ones, and ship that to the browser job. Same flow, same split, plus the workspace.
      - name: The developer-surface site for the browser job
        working-directory: ${{ env.PORT }}
        run: sbt 'run --auditMode --allScreens --scenarioMode --singleQuestionPerScreen'

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.PORT }}/out
          retention-days: 3
          if-no-files-found: error

  # ── browser: the households and the axe pass ────────────────────────────────────────────────
  # The site is served statically on port 3008 with the port's own tests/static-server.mjs, so
  # http://localhost:3008/app/direct-file/ resolves exactly as it does under nginx or `make dev`;
  # scripts/virginia-a11y.cjs has that address written into it. Playwright and axe-core are the
  # ones pinned in stack/browser-tools, as on a developer's machine.
  browser:
    name: Households and accessibility
    needs: scala
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: stack/browser-tools/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ env.PORT }}/out

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('stack/browser-tools/package-lock.json') }}

      - name: The pinned Playwright and axe-core, and Chromium
        run: make browser-tools
      - name: Chromium's system libraries
        run: sudo -E env "PATH=$PATH" node stack/browser-tools/node_modules/playwright-core/cli.js install-deps chromium

      - name: Serve the site on port 3008
        run: |
          SMOKE_PORT=3008 SMOKE_ROOT="$PWD/$PORT/out" node "$PORT/tests/static-server.mjs" > static-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sfo /dev/null http://localhost:3008/app/direct-file/ && break
            sleep 1
          done
          curl -sfo /dev/null http://localhost:3008/app/direct-file/ || { cat static-server.log; exit 1; }

      - name: The 28 households against an independent model of the rules
        run: make virginia-cases

      - name: axe over the Virginia screens
        run: make virginia-a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: va-cases
          path: ${{ env.PORT }}/target/va-cases
          if-no-files-found: ignore

  # ── handoff-verify: the patch series against the IRS repository ─────────────────────────────
  # Weekly as well as on main, because the thing that can break it, GitHub no longer serving the
  # pinned commit, happens without a commit here. Full history: export.sh finds the subtree's
  # squash commit by walking the log.
  handoff-verify:
    name: Patches apply at the IRS pin
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml
      - name: Clone the IRS repository at the pin, apply, check
        run: make handoff-verify

  # ── docker: the prod-like image ─────────────────────────────────────────────────────────────
  # docker compose build of the port's own compose file, without the dev overlay, with the layer
  # cache kept in GitHub Actions between runs. Bake reads the compose file (including its
  # additional_contexts for the three sibling libraries) and is what `docker compose build`
  # delegates to; it is called directly here because the cache exporter is a bake setting, and the
  # IRS's compose file is not ours to edit.
  docker:
    name: Prod-like image
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 4 * * *') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose build (via bake, with the GHA layer cache)
        uses: docker/bake-action@v5
        with:
          source: .
          workdir: ${{ env.PORT }}
          files: docker-compose.yml
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
